<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>随机背景图片示例</title>
    <style>
        :root {
            --bg-img: url("https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=1920&h=1080&fit=crop");
        }

        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            background-image: var(--bg-img);
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            transition: background-image 0.5s ease-in-out;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: rgba(0, 0, 0, 0.5);
            color: white;
            text-align: center;
            font-family: Arial, sans-serif;
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 2rem;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
        }

        .button {
            padding: 12px 24px;
            font-size: 1.2rem;
            background-color: rgba(255, 255, 255, 0.2);
            color: white;
            border: 2px solid white;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .button:hover {
            background-color: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }

        .info {
            margin-top: 2rem;
            padding: 1rem;
            background-color: rgba(0, 0, 0, 0.7);
            border-radius: 10px;
            max-width: 600px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>随机背景图片示例</h1>
        <button class="button" onclick="refreshRandomBackground()">换一张背景图片</button>
        <div class="info">
            <p>这个页面使用了JavaScript脚本来随机选择背景图片。</p>
            <p>CSS变量 <code>--bg-img</code> 被设置为从预定义列表中随机选择的图片URL。</p>
            <p>点击按钮可以手动刷新背景图片。</p>
        </div>
    </div>

    <!-- 引入随机背景脚本 -->
    <script src="random-bg.js"></script>
</body>
</html>
